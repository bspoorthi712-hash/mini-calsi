<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Calculator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #dbeafe, #f5f3ff);
    }
    .calculator {
      width: 100%;
      max-width: 320px;
      background: #1e293b;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 16px 35px #0f172a33;
    }
    h1 {
      margin: 0 0 16px;
      color: white;
      font-size: 20px;
      text-align: center;
    }
    #display {
      width: 100%;
      height: 70px;
      margin-bottom: 14px;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: #f8fafc;
      color: #0f172a;
      font-size: 28px;
      text-align: right;
    }
    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
    }
    button {
      min-height: 52px;
      border: 0;
      border-radius: 10px;
      background: #334155;
      color: white;
      font-size: 19px;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.15); }
    .operator { background: #7c3aed; }
    .clear { background: #dc2626; }
    .equals { background: #16a34a; }
    .zero { grid-column: span 2; }
    .hint {
      margin: 14px 0 0;
      color: #cbd5e1;
      text-align: center;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="calculator">
    <h1>Mini Calculator</h1>
    <input id="display" value="0" aria-label="Calculator display" readonly>
    <div class="keys">
      <button class="clear" data-action="clear">AC</button>
      <button data-action="backspace">⌫</button>
      <button class="operator" data-value="%">%</button>
      <button class="operator" data-value="/">÷</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="*">×</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="-">−</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="operator" data-value="+">+</button>

      <button class="zero" data-value="0">0</button>
      <button data-value=".">.</button>
      <button class="equals" data-action="equals">=</button>
    </div>
    <p class="hint">Simple calculator • Works offline</p>
  </main>

  <script>
    const display = document.getElementById("display");
    let expression = "";
    let justCalculated = false;

    function update() {
      display.value = expression || "0";
    }

    function calculate() {
      if (!expression || !/^[0-9+\-*/%.() ]+$/.test(expression)) return;
      try {
        const result = Function('"use strict"; return (' + expression + ')')();
        if (typeof result !== "number" || !Number.isFinite(result)) {
          display.value = "Error";
          expression = "";
          return;
        }
        expression = String(Number(result.toFixed(10)));
        display.value = expression;
        justCalculated = true;
      } catch {
        display.value = "Error";
        expression = "";
      }
    }

    document.querySelector(".keys").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      const action = button.dataset.action;
      const value = button.dataset.value;

      if (action === "clear") {
        expression = "";
        justCalculated = false;
        update();
        return;
      }
      if (action === "backspace") {
        expression = expression.slice(0, -1);
        justCalculated = false;
        update();
        return;
      }
      if (action === "equals") {
        calculate();
        return;
      }

      if (justCalculated && /[0-9.]/.test(value)) expression = "";
      justCalculated = false;
      expression += value;
      update();
    });

    document.addEventListener("keydown", (event) => {
      if (/^[0-9.+\-*/%()]$/.test(event.key)) {
        expression += event.key;
        justCalculated = false;
        update();
      } else if (event.key === "Enter" || event.key === "=") {
        calculate();
      } else if (event.key === "Backspace") {
        expression = expression.slice(0, -1);
        update();
      } else if (event.key === "Escape") {
        expression = "";
        update();
      }
    });
  </script>
</body>
</html>
